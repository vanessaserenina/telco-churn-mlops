name: CI - Retrain Model (MLflow Project)

on:
  push:
    branches: [ main ]
    paths:
      - "MLProject/**"
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MLflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.14.1 scikit-learn==1.4.2 pandas==2.2.2 numpy==1.26.4

      - name: Run MLflow Project (retrain model)
        working-directory: ./MLProject
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          mlflow run . --env-manager=local -P data_dir=Telco-Customer-Churn_preprocessing

      - name: Upload MLflow tracking artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: MLProject/mlruns